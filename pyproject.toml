[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepm"
version = "0.1.0"
description = "Self-Evolving Procedural Memory Grounded in Task Graphs for Multi-Agent Collaboration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
eval = [
    "openai>=1.58,<3",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.scripts]
sepm = "sepm.cli:main"
sepm-benchmark = "sepm.benchmark:main"
sepm-eval = "sepm.evaluation_runner:main"
sepm-ablation = "sepm.ablation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sepm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
